<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap Journal — Personal Cartography & Gamified Field Tracker</title>

  <!-- Google Fonts: Newsreader (Editorial Serif), Work Sans (Grotesque Sans), JetBrains Mono (Monospace) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Dexie.js CDN Script -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>

  <!-- Confetti Celebration CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Global Archival Navigation Bar -->
  <header class="global-navbar">
    <div class="navbar-inner">
      <a href="#/" class="brand-anchor">
        <div class="brand-seal">RJ</div>
        <div class="brand-text">
          <span class="brand-title">Roadmap Journal</span>
          <span class="brand-sub">FIELD ARCHIVE // EST. 2026</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="#/" class="nav-link active" data-nav-route="/">Field Index</a>
        <a href="#/progress" class="nav-link" data-nav-route="/progress">Scholar Progress</a>
        <a href="#/progress/challenges" class="nav-link" data-nav-route="/progress/challenges">Daily SRS</a>
      </nav>

      <div class="nav-controls">
        <button id="btn-theme-toggle" class="theme-toggle-btn" title="Toggle Light / Dark Stationery Theme" aria-label="Toggle Theme">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Application Root View Container -->
  <main id="app-root"></main>

  <!-- Global Toast Notification Container -->
  <aside id="toast-container" aria-live="polite"></aside>

  <!-- Application Entry Script (ES6 Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
